<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Biberon Tracker Baby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root{--bg:#f4fbff;--card:#ffffff;--text:#203049;--muted:#6f7f95;--line:#dcecf7;--pink:#5bb7ff;--pink2:#9ad6ff;--blue:#7cc7ff;--mint:#7ee6c0;--lav:#6fb8ff;--shadow:0 10px 24px rgba(91,183,255,.10);} *{box-sizing:border-box} body{margin:0;font-family:Nunito,system-ui,sans-serif;background:radial-gradient(circle at top,#fff 0,#f4fbff 35%,#eaf6ff 100%);color:var(--text);} 
  .app{max-width:980px;margin:0 auto;padding:10px 10px 18px;} .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px} h1{margin:0;font-size:1.3rem;line-height:1.1} .sub{margin-top:3px;color:var(--muted);font-size:.88rem} .pill{padding:9px 11px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:.84rem;color:var(--muted);box-shadow:var(--shadow);white-space:nowrap}
  .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:12px;} @media (max-width:860px){.grid{grid-template-columns:1fr}} .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);} .card h2{margin:0 0 10px;font-size:1rem}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;} @media (max-width:560px){.stats{grid-template-columns:1fr}} .stat{border:1px solid #e1eef9;border-radius:18px;padding:12px;background:linear-gradient(180deg,#fff,#f8fcff)} .label{color:var(--muted);font-size:.78rem;margin-bottom:5px}.value{font-size:1.18rem;font-weight:800;letter-spacing:-.03em}
  .meter{height:12px;background:#fde8f1;border-radius:999px;overflow:hidden;border:1px solid #d7e9f7;margin-top:8px}.meter>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--lav),#bfe4ff);width:0%}
  .inputs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px} @media (max-width:560px){.inputs{grid-template-columns:1fr}} label{display:block;font-size:.79rem;color:var(--muted);margin-bottom:5px} input,button{width:100%;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:14px;padding:12px 13px;font-size:1rem;outline:none} input:focus{border-color:#bcdaf1;box-shadow:0 0 0 4px rgba(91,183,255,.09)} button{font-weight:800;cursor:pointer} button.primary{background:linear-gradient(135deg,var(--pink),#ff9ac6);color:#fff;border:none} button.ghost{background:#fff} .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .smallrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px} @media (max-width:560px){.smallrow{grid-template-columns:1fr}} .tiny{font-size:.78rem;color:var(--muted)} .timeline{margin-top:10px;display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto;padding-right:2px} .feed{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border:1px solid #e1eef9;border-radius:16px;background:#fbfeff} .feed strong{display:block}.feed small{color:var(--muted)} .badge{align-self:center;padding:7px 10px;border-radius:999px;background:linear-gradient(90deg,#eef7ff,#f2f7ff);color:#4b7fb8;font-size:.78rem;font-weight:800}
  .chartbox{height:250px} .footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:10px}
  .topart{display:flex;align-items:center;gap:10px}.icon{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#d9efff,#dbe8ff);display:grid;place-items:center;font-size:1.25rem;box-shadow:var(--shadow)}
  @media (max-width:520px){.app{padding:8px}.card{padding:12px}.top{margin-bottom:8px}.pill{font-size:.78rem;padding:8px 10px}.chartbox{height:220px}.timeline{max-height:300px}}
</style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="topart"><div class="icon">🍼</div><div><h1>Biberon Tracker</h1></div></div>
      <div class="pill" id="todayLabel"></div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Riepilogo di oggi</h2>
        <div class="stats">
          <div class="stat"><div class="label">Latte assunto</div><div class="value" id="todayMl">0 ml</div></div>
          <div class="stat"><div class="label">Biberon</div><div class="value" id="todayBottles">0</div></div>
          <div class="stat"><div class="label">Obiettivo</div><div class="value" id="goalLabel">0 ml</div></div>
        </div>
        <div class="tiny">Completamento giornaliero</div>
        <div class="meter"><div id="meterFill"></div></div>
        <div class="smallrow">
          <div><div class="tiny">Ultimo pasto</div><div id="lastFeed" style="font-weight:800;font-size:1.02rem;margin-top:4px">—</div></div>
          <div><div class="tiny">Totale settimana</div><div id="weekTotal" style="font-weight:800;font-size:1.02rem;margin-top:4px">0 ml</div></div>
        </div>
        <div class="timeline" id="timeline"></div>
      </div>

      <div class="card">
        <h2>Impostazioni e registrazione</h2>
        <div class="inputs">
          <div><label>Obiettivo giornaliero (ml)</label><input id="dailyGoal" type="number" min="0" value="750"></div>
          <div><label>Capacità biberon (ml)</label><input id="bottleSize" type="number" min="0" value="120"></div>
          <div><label>Latte consumato (ml)</label><input id="milkMl" type="number" min="0" placeholder="Es. 90"></div>
          <div><label>Ora automatica</label><input id="autoTime" type="text" readonly></div>
        </div>
        <div class="actions">
          <button class="primary" id="addFeed">Aggiungi pasto</button>
          <button class="ghost" id="resetToday">Azzera oggi</button>
        </div>
        <div class="actions">
          <button class="ghost" id="saveSettings">Salva impostazioni</button>
          <button class="ghost" id="clearAll">Cancella tutto</button>
        </div>
        <div style="margin-top:12px">
          <h2 style="margin-top:0">Grafico settimanale</h2>
          <div class="chartbox"><canvas id="weekChart"></canvas></div>
        </div>
      </div>
    </div>
    <div class="footer">Tutto salvato nel browser del dispositivo.</div>
  </div>
<script>
const LS='biberon_tracker_v3';
const el=id=>document.getElementById(id);
const now=()=>new Date();
const pad=n=>String(n).padStart(2,'0');
const fmtDate=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
const todayKey=()=>new Date().toISOString().slice(0,10);
const timeStr=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
let state=JSON.parse(localStorage.getItem(LS)||'null')||{settings:{dailyGoal:750,bottleSize:120},feeds:{}};
const save=()=>localStorage.setItem(LS,JSON.stringify(state));
function ensureToday(){const k=todayKey(); if(!state.feeds[k]) state.feeds[k]=[];}
function bottleCount(ml){const size=+el('bottleSize').value||1; return Math.ceil(ml/size);} 
function todayStats(){ensureToday(); const arr=state.feeds[todayKey()]; return {ml:arr.reduce((a,b)=>a+b.ml,0), bottles:arr.reduce((a,b)=>a+b.bottles,0), last:arr[0]?arr[0].time:'—'};}
function weekData(){const out=[]; const d=new Date(); d.setHours(0,0,0,0); for(let i=6;i>=0;i--){const x=new Date(d); x.setDate(d.getDate()-i); const k=x.toISOString().slice(0,10); out.push({label:`${pad(x.getDate())}/${pad(x.getMonth()+1)}`, ml:(state.feeds[k]||[]).reduce((a,b)=>a+b.ml,0)});} return out;}
function render(){ensureToday(); const s=todayStats(); const goal=+el('dailyGoal').value||1; const pct=Math.min(100,Math.round((s.ml/goal)*100)); el('todayLabel').textContent=fmtDate(new Date()); el('todayMl').textContent=`${s.ml} ml`; el('todayBottles').textContent=s.bottles; el('goalLabel').textContent=`${+el('dailyGoal').value||0} ml`; el('meterFill').style.width=pct+'%'; el('lastFeed').textContent=s.last; el('weekTotal').textContent=`${weekData().reduce((a,b)=>a+b.ml,0)} ml`; el('autoTime').value=timeStr(now()); el('timeline').innerHTML=(state.feeds[todayKey()]||[]).map(f=>`<div class='feed'><div><strong>${f.ml} ml • ${f.bottles} biberon${f.bottles>1?'i':''}</strong><small>${f.time}</small></div><div class='badge'>${f.rate}</div></div>`).join('')||'<div class="feed"><div><strong>Nessun pasto registrato</strong><small>Il primo inserimento apparirà qui.</small></div><div class="badge">Oggi</div></div>'; chart.data.labels=weekData().map(x=>x.label); chart.data.datasets[0].data=weekData().map(x=>x.ml); chart.update(); save();}
function addFeed(){const ml=+el('milkMl').value; if(!ml||ml<0) return; ensureToday(); const bottles=bottleCount(ml); state.feeds[todayKey()].unshift({ml,bottles,time:timeStr(now()),rate:`${Math.round(ml/bottles)} ml/bib.`}); el('milkMl').value=''; render();}
function resetToday(){state.feeds[todayKey()]=[]; render();}
function clearAll(){if(confirm('Cancellare tutti i dati?')){state={settings:{dailyGoal:+el('dailyGoal').value||750,bottleSize:+el('bottleSize').value||120},feeds:{}}; render();}}
function saveSettings(){state.settings.dailyGoal=+el('dailyGoal').value||0; state.settings.bottleSize=+el('bottleSize').value||0; render();}
el('dailyGoal').value=state.settings.dailyGoal||750; el('bottleSize').value=state.settings.bottleSize||120;
const chart=new Chart(el('weekChart'),{type:'line',data:{labels:[],datasets:[{label:'ml per giorno',data:[],tension:.35,fill:true,borderColor:'#5bb7ff',backgroundColor:'rgba(91,183,255,.14)',pointBackgroundColor:'#5bb7ff',pointBorderColor:'#fff',pointRadius:5,borderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#6f7f95'},grid:{display:false}},y:{ticks:{color:'#6f7f95'},grid:{color:'#e4f1fb'}}}}});
el('addFeed').onclick=addFeed; el('resetToday').onclick=resetToday; el('saveSettings').onclick=saveSettings; el('clearAll').onclick=clearAll; el('milkMl').addEventListener('keydown',e=>{if(e.key==='Enter') addFeed()}); render(); setInterval(()=>{el('autoTime').value=timeStr(now());},60000);
</script>
</body>
</html>
